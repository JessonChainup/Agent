# 将 apps/prototype 构建产物发布到 GitHub Pages（仅 push 到默认分支时运行，不参与 PR）。
# 仓库需启用：Settings → Pages → Build and deployment → Source: GitHub Actions。
# 私有仓库免费套餐可能不可用 Pages；可用 artifact + 自建静态托管代替。

name: Deploy prototype to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: apps/prototype
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/prototype/package-lock.json

      - name: Install
        run: npm ci

      # 用户/组织站点仓库 username.github.io 使用站点根路径 "/"，其余仓库使用 "/<repo>/"
      - name: Build (Pages base path)
        env:
          VITE_PAGES_BASE: ${{ github.event.repository.name == format('{0}.github.io', github.repository_owner) && '/' || format('/{0}/', github.event.repository.name) }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/prototype/dist

      - id: deployment
        uses: actions/deploy-pages@v4
